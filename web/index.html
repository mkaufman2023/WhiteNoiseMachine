<!DOCTYPE html>
<html lang="en" data-mode="standard">
<head>
<meta charset="utf-8">
<title>Acoustic Wellness Unit</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wellness">
<meta name="theme-color" content="#0B1418">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="manifest" href="/manifest.json">

<style>
/* ============================================================
   Palette. Two temperatures, switched by [data-mode] on <html>.
   Standard is the Lumon basement: cold blue-green ground, warm
   bone text, pale institutional cyan. Night drops all blue and
   pulls luminance way down -- amber is easier on melatonin and
   won't wreck dark-adapted eyes at 2 a.m.
   ============================================================ */
:root {
  --ink:    #0B1418;
  --panel:  #111E24;
  --raised: #16262D;
  --rule:   #23383F;
  --accent: #8FD3D8;
  --bone:   #E8E4D9;
  --dim:    #6A8288;
  --glow:   rgba(143, 211, 216, 0.14);
}
html[data-mode="night"] {
  --ink:    #050403;
  --panel:  #0B0806;
  --raised: #100B07;
  --rule:   #241A0D;
  --accent: #B5762A;
  --bone:   #9A6C2E;
  --dim:    #5A3F1C;
  --glow:   rgba(181, 118, 42, 0.10);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  padding: calc(env(safe-area-inset-top) + 1rem) 1rem calc(env(safe-area-inset-bottom) + 2rem);
  background: var(--ink);
  color: var(--bone);
  font-family: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  max-width: 34rem;
  margin-inline: auto;
  transition: background 400ms ease, color 400ms ease;
}

/* Institutional label: the workhorse of the whole type system. */
.eyebrow {
  font-size: 0.64rem;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--dim);
}

/* All numeric data is monospaced. Labels are tracked caps, values are
   mono -- that split is the typographic personality here, and it costs
   no font download. */
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-variant-numeric: tabular-nums;
}

/* ---------- header ---------- */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding-bottom: 0.9rem;
  border-bottom: 1px solid var(--rule);
}
#brand { cursor: default; }

/* Things you press and hold: no iOS text-selection or callout popup. */
#brand, .fav, .list button {
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

.lamp {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  font-size: 0.6rem;
  font-weight: 600;
  letter-spacing: 0.16em;
  color: var(--dim);
}
.lamp .dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--dim);
  transition: background 300ms ease, box-shadow 300ms ease;
}
.lamp[data-up="1"] { color: var(--accent); }
.lamp[data-up="1"] .dot {
  background: var(--accent);
  box-shadow: 0 0 0 4px var(--glow);
}
.lamp[data-up="0"] .dot { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 0.25; } 50% { opacity: 1; } }

/* ---------- now playing ---------- */
.now { padding: 1.6rem 0 1.4rem; }
.now-name {
  font-size: 2rem;
  font-weight: 300;
  letter-spacing: -0.02em;
  line-height: 1.1;
  margin: 0.5rem 0 0.4rem;
}
.now-meta {
  font-size: 0.7rem;
  letter-spacing: 0.14em;
  color: var(--dim);
  text-transform: uppercase;
}

button {
  font-family: inherit;
  border: 1px solid var(--rule);
  background: var(--panel);
  color: var(--bone);
  cursor: pointer;
  transition: background 150ms ease, border-color 150ms ease, transform 80ms ease;
}
button:active { transform: scale(0.985); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#btnToggle {
  width: 100%;
  margin-top: 1.2rem;
  padding: 1.15rem;
  font-size: 0.76rem;
  font-weight: 600;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  border-radius: 2px;
  border-color: var(--accent);
  color: var(--accent);
  background: transparent;
}
#btnToggle[data-on="1"] { background: var(--glow); }

/* ---------- volume ---------- */
.vol { padding: 1.3rem 0 1.5rem; border-top: 1px solid var(--rule); }
.vol-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 0.9rem;
}
.readout {
  font-size: 1.65rem;
  font-weight: 300;
  color: var(--accent);
  line-height: 1;
}
/* Shown only while the actual level is still walking to the setpoint --
   this is the fade engine made visible. */
.target {
  font-size: 0.78rem;
  color: var(--dim);
  margin-left: 0.4rem;
}

input[type=range] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 44px;              /* full-height touch target */
  background: transparent;
  margin: 0;
}
input[type=range]::-webkit-slider-runnable-track {
  height: 2px;
  background: var(--rule);
}
input[type=range]::-moz-range-track { height: 2px; background: var(--rule); }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 26px; height: 26px;
  margin-top: -12px;
  border-radius: 50%;
  background: var(--accent);
  border: none;
  box-shadow: 0 0 0 6px var(--glow);
}
input[type=range]::-moz-range-thumb {
  width: 26px; height: 26px;
  border: none;
  border-radius: 50%;
  background: var(--accent);
}

/* ---------- sections ---------- */
section.block { padding-top: 1.3rem; border-top: 1px solid var(--rule); }
.block-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 0.85rem;
}
.hint {
  font-size: 0.58rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--rule);
}

/* ---------- pinned ---------- */
.fav-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
  gap: 0.6rem;
  margin-bottom: 1.4rem;
}
.fav {
  text-align: left;
  padding: 1.05rem 0.9rem;
  border-radius: 2px;
  background: var(--raised);
}
.fav .n {
  display: block;
  font-size: 0.95rem;
  font-weight: 400;
  letter-spacing: -0.01em;
}
.fav .f {
  display: block;
  margin-top: 0.4rem;
  font-size: 0.6rem;
  letter-spacing: 0.14em;
  color: var(--dim);
}
.fav[data-active="1"] {
  border-color: var(--accent);
  background: var(--glow);
}
.fav[data-active="1"] .n { color: var(--accent); }

/* ---------- full list ---------- */
.list { list-style: none; margin: 0; padding: 0; }
.list button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 0.95rem 0.9rem 0.95rem 0.75rem;
  border: none;
  border-bottom: 1px solid var(--rule);
  background: transparent;
  border-left: 2px solid transparent;
  font-size: 0.98rem;
  font-weight: 300;
  text-align: left;
}
.list button[data-active="1"] {
  border-left-color: var(--accent);
  color: var(--accent);
  background: var(--glow);
}
.list .file {
  font-size: 0.68rem;
  letter-spacing: 0.1em;
  color: var(--dim);
}
.list .pin { color: var(--accent); margin-right: 0.5rem; font-size: 0.7rem; }

/* ---------- footer / diagnostics ---------- */
footer { margin-top: 1.8rem; display: flex; gap: 0.6rem; }
footer button {
  flex: 1;
  padding: 0.9rem;
  font-size: 0.62rem;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  border-radius: 2px;
  color: var(--dim);
}
footer button[data-on="1"] { color: var(--accent); border-color: var(--accent); }

.diag { margin-top: 1.2rem; padding-top: 1.2rem; border-top: 1px solid var(--rule); }
.diag-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.5rem 1rem;
  font-size: 0.72rem;
  margin-bottom: 0.9rem;
}
.diag-grid span:nth-child(odd) { color: var(--dim); letter-spacing: 0.1em; text-transform: uppercase; font-size: 0.6rem; }
#term {
  height: 11rem;
  overflow-y: auto;
  padding: 0.7rem;
  background: #000;
  color: var(--accent);
  font-size: 0.68rem;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-all;
  border: 1px solid var(--rule);
}

/* Firmware update, at the bottom of Diagnostics. */
.update { display: grid; gap: 0.7rem; margin-top: 1.2rem; }
.update input { font-family: inherit; color: var(--bone); min-width: 0; }
.update input[type=file] { font-size: 0.72rem; }
.update input[type=file]::file-selector-button,
#upGo {
  padding: 0.7rem 1rem;
  margin-right: 0.8rem;
  font-family: inherit;
  font-size: 0.62rem;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  border: 1px solid var(--rule);
  border-radius: 2px;
  background: var(--panel);
  color: var(--dim);
}
.update-row { display: flex; gap: 0.6rem; }
#upKey {
  flex: 1;
  padding: 0.6rem 0.7rem;
  font-size: 1rem;            /* 16px: iOS zooms the page into any smaller field */
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 2px;
}
#upKey:focus { outline: none; border-color: var(--accent); }
#upGo { margin-right: 0; color: var(--accent); border-color: var(--accent); }
#upGo:disabled { opacity: 0.4; }
.bar { height: 2px; background: var(--rule); }
.bar span { display: block; height: 100%; width: 0; background: var(--accent); }
#upMsg { font-size: 0.68rem; line-height: 1.5; color: var(--dim); min-height: 1.5em; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>

<body>

<header>
  <div class="eyebrow" id="brand">Acoustic Wellness Unit</div>
  <div class="lamp" id="lamp" data-up="0"><span class="dot"></span><span id="lampText">Linking</span></div>
</header>

<section class="now">
  <div class="eyebrow">Now refining</div>
  <div class="now-name" id="nowName">&mdash;</div>
  <div class="now-meta mono" id="nowMeta">Waiting for the box</div>
  <button id="btnToggle" data-on="0">Play</button>
</section>

<section class="vol">
  <div class="vol-head">
    <span class="eyebrow">Volume</span>
    <span>
      <span class="readout mono" id="volNow">0</span><span class="target mono" id="volTarget"></span>
    </span>
  </div>
  <input type="range" id="volSlider" min="0" max="30" step="1" value="0" aria-label="Volume">
</section>

<section class="block" id="favBlock" hidden>
  <div class="block-head"><span class="eyebrow">Pinned</span></div>
  <div class="fav-grid" id="favGrid"></div>
</section>

<section class="block">
  <div class="block-head">
    <span class="eyebrow">All sounds</span>
    <span class="hint">Hold a row to pin</span>
  </div>
  <ul class="list" id="list"></ul>
</section>

<footer>
  <button id="btnNight">Night mode</button>
  <button id="btnStop">Stop</button>
</footer>

<section class="diag" id="diag" hidden>
  <div class="diag-grid mono">
    <span>Address</span><span id="dIp">&mdash;</span>
    <span>Signal</span><span id="dRssi">&mdash;</span>
    <span>mDNS</span><span id="dMdns">&mdash;</span>
    <span>Audio module</span><span id="dHw">&mdash;</span>
    <span>Uptime</span><span id="dUp">&mdash;</span>
    <span>Track</span><span id="dTrack">&mdash;</span>
    <span>UI build</span><span id="dUi">&mdash;</span>
    <span>Firmware</span><span id="dFw">&mdash;</span>
  </div>
  <div id="term" class="mono">Diagnostics open. Log streaming.</div>

  <div class="update">
    <div class="eyebrow">Update firmware</div>
    <input type="file" id="upFile" aria-label="Firmware file (firmware.bin)">
    <div class="update-row">
      <input type="password" id="upKey" placeholder="Update key" autocomplete="off" aria-label="Update key">
      <button id="upGo">Install</button>
    </div>
    <div class="bar" id="upBar" hidden><span></span></div>
    <div class="mono" id="upMsg"></div>
  </div>
</section>

<script>
"use strict";

/* Track list. Track N is the Nth file copied onto the SD card -- the module
   numbers files in the order they were copied, not by name. */
const SOUNDS = [
  [1,  "Airplane Cabin"], [2,  "Celestial"],     [3,  "Thunderstorm"],
  [4,  "Rain"],           [5,  "Rainforest"],    [6,  "Waterfall"],
  [7,  "Water Fountain"], [8,  "Ocean Waves"],   [9,  "Fan"],
  [10, "Campfire"],       [11, "Shower"],        [12, "Hairdryer"],
  [13, "Vacuum"],         [14, "Soup"]
];
const NAME = new Map(SOUNDS);
const pad2 = n => String(n).padStart(2, "0");

const el = id => document.getElementById(id);
let ws = null, backoff = 500, dragging = false, lastSent = 0, diagOpen = false;
let newUiComing = Promise.resolve(false);   /* per connection: true if the page is about to reload onto a new UI */
let state = { play:false, trk:1, vol:0, vnow:0, fade:false, hw:0, favs:0,
              rssi:0, ip:"", mdns:false, up:0, ui:"", fw:"", rb:false };

/* Audio module status, as reported by the box (Player::Hw). */
const HW_WARMING = 0, HW_FAULT = 3;
const HW_TEXT = ["warming up", "ready", "no replies (fixed timing)", "not responding"];

/* ---------- transport ---------- */
function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");

  ws.onopen = () => {
    backoff = 500;
    setLamp(true);
    if (diagOpen) send("log_on");
    send("state");

    /* The box may be back from an update with a new UI: look for it now,
       not at the next launch. If there is one, the page reloads itself. */
    if ("serviceWorker" in navigator) {
      newUiComing = navigator.serviceWorker.getRegistration()
        .then(r => r ? r.update().then(() => !!r.installing) : false)
        .catch(() => false);
    }
  };

  ws.onclose = () => {
    setLamp(false);
    setTimeout(connect, backoff);
    backoff = Math.min(backoff * 1.6, 5000);
  };

  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.t === "s") {
      state = m; render();
      /* Report on an update from the page that will stay, not one about to reload. */
      if (pending) newUiComing.then(coming => { if (!coming) checkUpdateResult(); });
    }
    else if (m.t === "L") { showLog(m.m); }     /* history, sent when the panel opens */
    else if (m.t === "l") { appendLog(m.m); }   /* new lines since */
  };
}

function send(cmd, extra) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(Object.assign({ cmd }, extra)));
}

function setLamp(up) {
  el("lamp").dataset.up = up ? "1" : "0";
  el("lampText").textContent = up ? "Linked" : "Not linked";
  if (!up) el("nowMeta").textContent = "The box is off or off-network";
}

/* ---------- render ---------- */
function render() {
  el("nowName").textContent = NAME.get(state.trk) || "\u2014";

  el("nowMeta").textContent =
        state.hw === HW_WARMING ? "Warming up"
      : state.hw === HW_FAULT   ? "Audio module not responding"
      : (state.play ? "Looping \u00b7 track " + pad2(state.trk) : "Paused");

  const t = el("btnToggle");
  t.textContent = state.play ? "Pause" : "Play";
  t.dataset.on = state.play ? "1" : "0";

  /* Actual level, which walks to the setpoint during a fade. */
  el("volNow").textContent = state.vnow;
  el("volTarget").textContent = (state.vnow !== state.vol) ? "\u2192 " + state.vol : "";

  /* Never fight the thumb while a finger is on it. */
  if (!dragging) el("volSlider").value = state.vol;

  renderFavorites();
  document.querySelectorAll("#list button").forEach(b => {
    const n = Number(b.dataset.track);
    b.dataset.active = (n === state.trk && state.play) ? "1" : "0";
    b.querySelector(".pin").textContent = isFav(n) ? "\u25C6" : "";
  });

  if (diagOpen) renderDiag();
}

const isFav = n => (state.favs & (1 << (n - 1))) !== 0;

/* Rebuilt only when the set of pins changes. State arrives every ~50 ms
   during a fade; rebuilding on each one destroyed the button under a finger
   mid-press, so the press never ended and the hold-to-unpin timer fired. */
let shownFavs = -1;

function renderFavorites() {
  const grid = el("favGrid");

  if (state.favs !== shownFavs) {
    shownFavs = state.favs;
    const pinned = SOUNDS.filter(([n]) => isFav(n));
    el("favBlock").hidden = pinned.length === 0;

    grid.textContent = "";
    for (const [n, name] of pinned) {
      const b = document.createElement("button");
      b.className = "fav";
      b.dataset.track = n;
      b.innerHTML = '<span class="n"></span><span class="f mono">Track ' + pad2(n) + "</span>";
      b.querySelector(".n").textContent = name;
      bindSound(b, n);
      grid.appendChild(b);
    }
  }

  grid.querySelectorAll("button").forEach(b => {
    b.dataset.active = (Number(b.dataset.track) === state.trk && state.play) ? "1" : "0";
  });
}

function renderDiag() {
  el("dIp").textContent   = state.ip || "\u2014";
  el("dRssi").textContent = state.rssi ? state.rssi + " dBm" : "\u2014";
  el("dMdns").textContent = state.mdns ? "whitenoise.local" : "down";
  el("dHw").textContent   = HW_TEXT[state.hw] || "\u2014";
  el("dTrack").textContent = pad2(state.trk) + " (copy order on the card)";
  el("dUi").textContent    = state.ui || "\u2014";
  el("dFw").textContent    = state.fw ? state.fw + (state.rb ? " (last update rolled back)" : "") : "\u2014";
  const s = state.up || 0;
  el("dUp").textContent = Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m";
}

function showLog(lines) {
  const t = el("term");
  t.textContent = lines || "(nothing logged yet)";
  t.scrollTop = t.scrollHeight;
}

function appendLog(lines) {
  const t = el("term");
  t.textContent += "\n" + lines;
  if (t.textContent.length > 6000) t.textContent = t.textContent.slice(-4000);
  t.scrollTop = t.scrollHeight;
}

/* ---------- sound list ---------- */
function buildList() {
  const ul = el("list");
  for (const [n, name] of SOUNDS) {
    const li = document.createElement("li");
    const b  = document.createElement("button");
    b.dataset.track = n;
    b.dataset.active = "0";
    b.innerHTML = '<span><span class="pin mono"></span><span class="nm"></span></span>' +
                  '<span class="file mono">' + pad2(n) + "</span>";
    b.querySelector(".nm").textContent = name;
    bindSound(b, n);
    li.appendChild(b);
    ul.appendChild(li);
  }
}

/* Tap plays. Hold pins or unpins -- the hold must not also fire the tap. */
function bindSound(node, track) {
  let timer = null, held = false;

  const start = () => {
    held  = false;
    timer = setTimeout(() => {
      held = true;
      send("favorite", { track });
      if (navigator.vibrate) navigator.vibrate(18);
    }, 500);
  };
  const cancel = () => { clearTimeout(timer); };

  node.addEventListener("pointerdown", start);
  node.addEventListener("pointerup", cancel);
  node.addEventListener("pointerleave", cancel);
  node.addEventListener("pointercancel", cancel);
  node.addEventListener("contextmenu", e => e.preventDefault());
  node.addEventListener("click", () => {
    if (held) { held = false; return; }
    send("play", { track });
    /* Optimistic: light up immediately, reconcile when the box reports back. */
    state.trk = track; state.play = true; render();
  });
}

/* ---------- controls ---------- */
el("btnToggle").addEventListener("click", () => {
  send("toggle");
  state.play = !state.play; render();
});

el("btnStop").addEventListener("click", () => {
  send("stop");
  state.play = false; render();
});

const slider = el("volSlider");
slider.addEventListener("pointerdown", () => { dragging = true; });
slider.addEventListener("input", () => {
  const v = Number(slider.value);
  el("volNow").textContent = v;         /* immediate local feedback */
  el("volTarget").textContent = "";
  const now = Date.now();
  if (now - lastSent > 60) { send("volume", { value: v }); lastSent = now; }
});
const release = () => {
  if (!dragging) return;
  dragging = false;
  send("volume", { value: Number(slider.value) });   /* always land the final value */
};
slider.addEventListener("pointerup", release);
slider.addEventListener("pointercancel", release);
slider.addEventListener("change", release);

/* ---------- night mode ---------- */
function applyNight(on) {
  document.documentElement.dataset.mode = on ? "night" : "standard";
  el("btnNight").dataset.on = on ? "1" : "0";
  document.querySelector('meta[name="theme-color"]')
          .setAttribute("content", on ? "#050403" : "#0B1418");
  try { localStorage.setItem("wnm-night", on ? "1" : "0"); } catch {}
}
el("btnNight").addEventListener("click", () => {
  applyNight(document.documentElement.dataset.mode !== "night");
});

/* ---------- diagnostics: hold the title ---------- */
function setDiag(open) {
  if (open === diagOpen) return;
  diagOpen = open;
  el("diag").hidden = !open;
  send(open ? "log_on" : "log_off");
  if (open) renderDiag();
}

(function () {
  let timer = null;
  const brand = el("brand");
  const toggle = () => {
    setDiag(!diagOpen);
    if (navigator.vibrate) navigator.vibrate(18);
  };
  brand.addEventListener("pointerdown", () => { timer = setTimeout(toggle, 900); });
  ["pointerup", "pointerleave", "pointercancel"].forEach(e =>
    brand.addEventListener(e, () => clearTimeout(timer)));
})();

/* ---------- firmware update (bottom of Diagnostics) ---------- */
/* The .bin goes straight to the box, which writes it into its spare firmware
   slot, checks it, and restarts into it. XMLHttpRequest rather than fetch(),
   because only it reports upload progress. How it went is shown once the box
   is back -- remembered in sessionStorage, since the page may reload itself
   onto a new UI in between. */
const PENDING = "wnm-update";
let pending = null;   /* { fw, at }: the firmware before, and when the upload finished */
try { pending = JSON.parse(sessionStorage.getItem(PENDING)); } catch {}
try { el("upKey").value = localStorage.getItem("wnm-ota-key") || ""; } catch {}

function upMsg(text) { el("upMsg").textContent = text; }
function upBar(frac) {
  el("upBar").hidden = frac === null;
  el("upBar").firstElementChild.style.width = ((frac || 0) * 100) + "%";
}

el("upGo").addEventListener("click", () => {
  const file = el("upFile").files[0];
  const key  = el("upKey").value.trim();
  if (!file) return upMsg("Choose the firmware.bin file first.");
  if (!key)  return upMsg("Enter the update key.");

  const go   = el("upGo");
  const xhr  = new XMLHttpRequest();
  const fail = text => { go.disabled = false; upBar(null); upMsg(text); };

  xhr.upload.onprogress = e => {
    if (!e.lengthComputable) return;
    upBar(e.loaded / e.total);
    upMsg(e.loaded < e.total ? "Sending\u2026 " + Math.floor(100 * e.loaded / e.total) + "%"
                             : "Checking the image\u2026");
  };
  xhr.onload = () => {
    if (xhr.status !== 200) return fail(xhr.responseText.trim() || "Update failed (" + xhr.status + ").");
    pending = { fw: state.fw, at: Date.now() };
    try { sessionStorage.setItem(PENDING, JSON.stringify(pending)); } catch {}
    try { localStorage.setItem("wnm-ota-key", key); } catch {}
    go.disabled = false;
    upMsg("Installed. The box is restarting\u2026");
  };
  xhr.onerror = () => fail("Lost the connection to the box during the upload. Try again.");

  go.disabled = true;
  upBar(0);
  upMsg("Sending\u2026");
  xhr.open("POST", "/api/update");
  xhr.setRequestHeader("X-OTA-Key", key);
  xhr.send(file);
});

/* Once the box has restarted since the upload (its uptime is shorter than
   the time since), say how the update went. */
function checkUpdateResult() {
  if (!pending || state.up * 1000 >= Date.now() - pending.at) return;   /* not restarted yet */
  const before = pending.fw;
  pending = null;
  try { sessionStorage.removeItem(PENDING); } catch {}

  upBar(null);
  upMsg(state.fw !== before ? "Updated. Now running firmware " + state.fw + "."
      : state.rb            ? "The new firmware failed its start-up checks, so the box went back to the old one."
      :                       "The box restarted on the same firmware. Was it the same file?");
  setDiag(true);
}

/* ---------- boot ---------- */
let night = false;
try { night = localStorage.getItem("wnm-night") === "1"; } catch {}
applyNight(night);
buildList();
render();
connect();

/* The service worker keeps a copy of the app so it opens instantly, even with
   the box off. After a firmware update changes the UI, the box serves a sw.js
   with a new fingerprint; the browser installs it in the background, and this
   page reloads once to show the new version. ("updateViaCache: none" makes
   the browser check sw.js on every launch rather than once a day.) */
if ("serviceWorker" in navigator) {
  /* The very first worker taking over isn't an update: nothing to reload. */
  let controlled = !!navigator.serviceWorker.controller, reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (controlled && !reloading) {
      reloading = true;
      location.reload();
    }
    controlled = true;
  });
  navigator.serviceWorker.register("/sw.js", { updateViaCache: "none" }).catch(() => {});
}
</script>
</body>
</html>
