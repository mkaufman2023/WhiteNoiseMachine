; PlatformIO Project Configuration File
;
; White Noise Machine - XIAO ESP32-C3
;
;   * pioarduino platform, pinned. It tracks current Arduino-ESP32 releases
;     (the official espressif32 PlatformIO platform lags). Pinned so a new
;     release can't silently change the core under you; bump it on purpose.
;   * The UI is served over HTTPS by ESP-IDF's built-in server, which the core
;     already includes -- no web server library needed.
;   * The web files and the HTTPS certificate are built into the firmware, so
;     there is no filesystem image to upload and the UI can never be out of
;     step with the firmware. The certificate comes from tools/make_certs.py.
;   * min_spiffs partition table: two ~1.9 MB app slots, room for wireless
;     updates. (Changing the partition table needs one flash over USB.)

[env:seeed_xiao_esp32c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = seeed_xiao_esp32c3
framework = arduino

board_build.partitions = min_spiffs.csv

; Built into the firmware; see the EMBEDDED() list in lib/WebApp/WebApp.cpp
board_build.embed_files =
    web/index.html
    web/sw.js
    web/manifest.json
    web/icon.svg
    web/icon-180.png
    web/icon-512.png
board_build.embed_txtfiles =
    certs/server.crt
    certs/server.key

; Upload Speed
upload_speed = 921600

; Serial Monitor Baud Rate
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Library Dependencies
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
