; PlatformIO Project Configuration File
;
; White Noise Machine - XIAO ESP32-C3
;
; Changes from the original:
;   * pioarduino platform, which tracks current Arduino-ESP32 releases (the
;     official espressif32 PlatformIO platform lags, and ESPAsyncWebServer
;     expects a recent core).
;   * LittleFS instead of SPIFFS (SPIFFS is deprecated and slower to mount).
;   * Async web server + WebSocket + JSON.
;   * Dropped dfrobot/DFRobotDFPlayerMini -- it was declared but never
;     included anywhere; the custom lib/DFPlayerMini driver replaced it.

[env:seeed_xiao_esp32c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c3
framework = arduino

; Filesystem for the web UI in data/  (upload with: pio run -t uploadfs)
board_build.filesystem = littlefs

; Upload Speed
upload_speed = 921600

; Serial Monitor Baud Rate
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Keeps the dependency finder from dragging in unrelated transitive libs
lib_ldf_mode = chain

; Library Dependencies
lib_deps =
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
    bblanchon/ArduinoJson @ ^7.0.0
